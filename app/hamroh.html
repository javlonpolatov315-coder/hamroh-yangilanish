}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:13px;line-height:1.45}
a{color:var(--link)}
/* ---- Shell ---- */
.app{display:flex;flex-direction:column;min-height:100%}
.tbar{background:var(--sheet);border-bottom:1px solid var(--rule-strong);display:flex;align-items:center;gap:10px;padding:5px 12px;padding-top:max(5px,env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.logo{width:24px;height:24px;border-radius:5px;background:#F6C400;display:grid;place-items:center;font-weight:800;color:#C00000;font-size:14px;flex:none}
.brand{font-weight:700;font-size:14px}
.tfirm{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}
.tfirm b{color:var(--ink);font-weight:600}
.tq{position:relative;flex:1 1 260px;max-width:420px;margin-left:12px}
.tq input{width:100%;padding:5px 10px!important;border-radius:4px!important}
.tqres{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--sheet);border:1px solid var(--rule-strong);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:30;max-height:380px;overflow:auto}
.tqres button{display:flex;width:100%;gap:10px;justify-content:space-between;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);color:var(--ink);font-weight:400;border-radius:0;padding:7px 10px}
.tqres button:hover,.tqres button.on{background:var(--sel)}
.tqres small{color:var(--muted);white-space:nowrap}
.firm{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;flex-wrap:wrap}
.firm label{color:var(--muted)}
.firm select{padding:4px 8px!important;border-radius:4px!important;font-weight:600;max-width:240px}
.firm .inn{display:none}
.menu{background:var(--menu);border-bottom:1px solid var(--menu-b);display:flex;gap:2px;padding:4px 8px;overflow-x:auto;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.menu a{color:var(--ink);text-decoration:none;padding:6px 13px;border-radius:3px;font-weight:500;white-space:nowrap}
.menu a:hover{background:rgba(255,255,255,.35)}
.menu a.on{background:var(--menu-on);box-shadow:inset 0 0 0 1px var(--menu-on-b)}
.menu a[hidden]{display:none}
.body{flex:1;display:grid;grid-template-columns:236px minmax(0,1fr);min-height:0}
.side{background:var(--side);border-right:1px solid var(--rule-strong);padding:8px 0 24px;padding-left:env(safe-area-inset-left,0px)}
.side h4{margin:12px 14px 4px;font-size:10.5px;color:var(--side-h);text-transform:uppercase;letter-spacing:.05em}
.side a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 14px 4px 22px;color:var(--link);text-decoration:none;cursor:pointer}
.side a:hover{text-decoration:underline}
.side a.on{background:var(--side-on);color:var(--ink);font-weight:600;text-decoration:none}
.side a.cur{background:var(--side-on);color:var(--ink)}
.side em{font-style:normal;background:#E5484D;color:#fff;border-radius:99px;padding:0 6px;font-size:10.5px;font-weight:600}
.side em.w{background:#F5A524}
.side .sx{display:contents}
.work{display:flex;flex-direction:column;min-width:0}
.otabs{display:flex;gap:2px;padding:6px 8px 0;background:var(--tab-bar);border-bottom:1px solid var(--rule-strong);overflow-x:auto}
.otabs a{display:flex;align-items:center;gap:6px;padding:5px 12px;background:var(--tab);border:1px solid var(--rule-strong);border-bottom:none;border-radius:4px 4px 0 0;color:var(--muted);text-decoration:none;white-space:nowrap;max-width:260px}
.otabs a span{overflow:hidden;text-overflow:ellipsis}
.otabs a.on{background:var(--sheet);color:var(--ink);font-weight:600;margin-bottom:-1px;padding-bottom:6px}
.otabs a i{font-style:normal;color:var(--muted);padding:0 2px;border-radius:3px}
.otabs a i:hover{background:var(--rule)}
main{background:var(--sheet);flex:1;min-width:0;padding:12px 16px 40px;padding-right:max(16px,env(safe-area-inset-right,0px))}
/* ---- Typography & blocks ---- */
h1{font-size:17px;line-height:1.25;margin:0;font-weight:600;text-wrap:balance}
h2{font-size:14px;margin:0;font-weight:600;text-wrap:balance}
h3{font-size:13.5px;font-weight:600}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
.head p{margin:3px 0 0;color:var(--muted);max-width:80ch;font-size:12.5px}
.gsearch{display:flex;align-items:center;gap:8px;margin:-4px 0 12px}
.gsearch input,#gq{flex:0 1 460px;width:460px;max-width:100%}
.gsearch .hint{white-space:nowrap}
tr.qhide{display:none}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--sheet);border:1px solid var(--rule-strong);border-radius:4px;padding:10px 12px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin:-10px -12px 10px;padding:6px 12px;background:var(--th);border-bottom:1px solid var(--th-b);border-radius:4px 4px 0 0}
.panel-h h2{color:var(--th-fg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.kpi{background:var(--sheet);border:1px solid var(--rule-strong);border-radius:4px;padding:8px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:11px;color:var(--muted);font-weight:500}
.kpi .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:11.5px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.in{color:var(--in)} .out{color:var(--out)}
.tw{overflow-x:auto;border:1px solid var(--rule-strong);border-radius:2px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--th);color:var(--th-fg);text-align:left;font-weight:600;font-size:12px;padding:5px 8px;border:1px solid var(--th-b);border-top:0;white-space:nowrap;position:sticky;top:0;z-index:1}
th:first-child{border-left:0} th:last-child{border-right:0}
td{padding:4px 8px;border:1px solid var(--rule);border-top:0;vertical-align:top}
td:first-child{border-left:0} td:last-child{border-right:0}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--sheet) 96%,var(--ink))}
tbody tr:hover td{background:var(--sel)}
tfoot td{font-weight:700;background:var(--th);border-color:var(--th-b)}
td.wrap{min-width:220px;max-width:420px;color:var(--muted);font-size:12px}
td.name{min-width:180px}
.acc{font-weight:600;font-variant-numeric:tabular-nums}
table.tabel td.tdam,table.tabel th.tdam{background:color-mix(in srgb,var(--gold) 12%,transparent)}
table.tabel td.tq .tbtn{outline:1px dashed var(--gold)}
.tbtn{all:unset;cursor:pointer;display:inline-block;min-width:20px;text-align:center;border-radius:3px;padding:1px 2px;font-variant-numeric:tabular-nums}
.tbtn:hover{background:color-mix(in srgb,var(--sky) 18%,transparent)}.tbtn:focus-visible{outline:2px solid var(--sky)}

/* ---------- Kirish ekrani (halqa → portlash → sahna) ---------- */
#salom{position:fixed;inset:0;z-index:9999;overflow:hidden;color:#EEF2FA;font-family:"Segoe UI",system-ui,sans-serif;transition:opacity .7s ease,visibility .7s}
#salom.ket{opacity:0;visibility:hidden}

@keyframes kiGrain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,2%)}100%{transform:translate(0,0)}}

#salom .ki-lg{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.08em;font-size:14px;opacity:.85}#salom .ki-lg svg{width:26px;height:26px}
#salom .ki-ov{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#EEF2FA;border-radius:18px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
#salom .ki-halqa{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;border:0;cursor:pointer;z-index:4;background:radial-gradient(circle,#140F24 0%,#0A0814 70%);box-shadow:0 0 40px rgba(242,196,107,.22);display:grid;place-items:center;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .4s,box-shadow .6s}
